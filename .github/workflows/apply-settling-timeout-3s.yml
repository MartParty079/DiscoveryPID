name: Apply 3s settling timeout

on:
  push:
    branches:
      - settling-timeout-3s
    paths:
      - .apply-settling-timeout-3s

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: settling-timeout-3s
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply patch
        run: python tools/_apply_settling_timeout_3s.py

      - name: Commit patched project files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md config/discoverypid.json jmp/DiscoveryPID_Position_V2.jsl scripts/position_v2/open_jmp.ps1 tools/run_position_trial.py
          git commit -m "Limit scored settling time to 3 seconds"
          git push origin HEAD:settling-timeout-3s
