name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  apply-half-step:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix-float-ack-tolerance' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-float-ack-tolerance
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply 0.5-step PID patch
        run: python tools/_apply_float_ack_tolerance.py

      - name: Verify patched Python
        run: python -m py_compile tools/run_position_trial.py tools/home_position.py

      - name: Commit patched project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Round PID coefficients to nearest 0.5" || exit 0
          git push origin HEAD:fix-float-ack-tolerance

  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio -r requirements.txt

      - name: Compile Python tools
        run: |
          python -m py_compile tools/run_position_trial.py tools/home_position.py

      - name: Parse PowerShell helpers
        shell: pwsh
        run: |
          $files = @(
            "DiscoveryPID.ps1",
            "scripts/position_v2/build_upload.ps1",
            "scripts/position_v2/home.ps1",
            "scripts/position_v2/open_jmp.ps1",
            "scripts/position_v2/smoke_test.ps1",
            "scripts/position_v2/control_test.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell parse failed: $file"
            }
          }

      - name: Check current position-study configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          fw = Path('src/main.cpp').read_text()
          py = Path('tools/run_position_trial.py').read_text()
          jsl = Path('jmp/DiscoveryPID_Position_V2.jsl').read_text()
          cfg = json.loads(Path('config/discoverypid.json').read_text())

          assert cfg['latestBranch'] == 'main'
          assert cfg['defaultPort'] == 'COM7'
          assert cfg['testOffsetDeg'] == 300.0
          assert cfg['pidRanges']['kp'] == [0.5, 1000.0]
          assert cfg['pidRanges']['ki'] == [0.0, 500.0]
          assert cfg['pidRanges']['kd'] == [0.0, 200.0]
          assert cfg['maxSettlingTimeSeconds'] == 3.0

          assert 'direct-position-pid-v3.4-300deg-10xrange' in fw
          assert 'MAX_POSITION_KP = 1000.0f' in fw
          assert 'MAX_POSITION_KI = 500.0f' in fw
          assert 'MAX_POSITION_KD = 200.0f' in fw
          assert 'COUNTS_PER_MOTOR_REV = 56.0f' in fw
          assert 'TEST_PREP_TIMEOUT_MS = 45000' in fw
          assert 'TEST_RETURN_TIMEOUT_MS = 45000' in fw
          assert 'EXPECTED_FW = "DiscoveryPID direct-position-pid-v3.4-300deg-10xrange"' in py
          assert 'default=300.0' in py
          assert 'default=60.0' in py
          assert '"--max-settling-seconds", type=float, default=3.0' in py
          assert 'status = "TEST_SETTLING_TIMEOUT"' in py
          assert 'studyName = "PositionStudy_DirectPID_v39_300Deg10xRange_3s";' in jsl
          assert 'maxSettlingTimeSeconds = 3.0;' in jsl
          assert '"--max-settling-seconds", Char( maxSettlingTimeSeconds )' in jsl
          assert 'testOffsetDeg = 300.0;' in jsl
          assert 'kpHigh = 1000.0;' in jsl
          assert 'kiHigh = 500.0;' in jsl
          assert 'kdHigh = 200.0;' in jsl
          assert '{100.0,   50.0,  20.00}' in jsl
          assert '{1000.0, 500.0, 200.00}' in jsl
          assert 'EVENT TEST_RETURN' in jsl
          assert 'cmdExecutable' not in jsl
          PY

      - name: Build Mega firmware
        run: platformio run
