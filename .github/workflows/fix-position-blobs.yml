name: Fix exact position source blobs

on:
  push:
    branches:
      - position-hold-bayesian
    paths:
      - position-fix/READY

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: position-hold-bayesian
          fetch-depth: 0

      - name: Restore exact generated source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/position-fix
          cat position-fix/worker00.b64-* | base64 -d > /tmp/position-fix/worker00
          cat position-fix/jsl00.b64-* | base64 -d > /tmp/position-fix/jsl00
          tail -c +14001 tools/run_position_trial.py > /tmp/position-fix/worker01
          tail -c +14001 jmp/DiscoveryPID_Position_Bayesian.jsl > /tmp/position-fix/jsl01
          cat /tmp/position-fix/worker00 /tmp/position-fix/worker01 > tools/run_position_trial.py
          cat /tmp/position-fix/jsl00 /tmp/position-fix/jsl01 > jmp/DiscoveryPID_Position_Bayesian.jsl
          python -m py_compile tools/run_position_trial.py

      - name: Commit exact source and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf position-fix tools/__pycache__
          rm -f .github/workflows/fix-position-blobs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Restore exact position tuning source files"
            git push origin HEAD:position-hold-bayesian
          fi
