name: Apply PID range patch on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'pid-range-10x'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pid-range-10x
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply patch
        run: python tools/_apply_pid_range_10x.py

      - name: Commit source/config changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # GitHub Actions tokens cannot modify workflow files in this repo.
          # CI is updated separately through the GitHub connector after this
          # source/config commit lands.
          git checkout -- .github/workflows/ci.yml

          rm -f \
            .apply-pid-range-10x \
            tools/_apply_pid_range_10x.py \
            notes/PID_RANGE_10X.md \
            notes/.keep \
            notes/README.md

          git add -A
          git commit -m "Expand direct PID search ranges by 10x"
          git push origin HEAD:pid-range-10x
