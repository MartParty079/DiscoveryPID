name: Apply half-step PID quantization

on:
  push:
    branches:
      - fix-float-ack-tolerance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-float-ack-tolerance
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply patch
        run: python tools/_apply_float_ack_tolerance.py

      - name: Commit patched project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Round PID coefficients to nearest 0.5" || exit 0
          git push origin HEAD:fix-float-ack-tolerance
