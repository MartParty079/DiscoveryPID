name: Assemble and clean position-hold package

on:
  push:
    branches:
      - position-hold-bayesian
    paths:
      - position-package/READY

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: position-hold-bayesian
          fetch-depth: 0

      - name: Assemble and validate source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src tools jmp docs/position_hold
          cat position-package/main.cpp.part-* > src/main.cpp
          cat position-package/run_position_trial.py.part-* > tools/run_position_trial.py
          cat position-package/DiscoveryPID_Position_Bayesian.jsl.part-* > jmp/DiscoveryPID_Position_Bayesian.jsl
          cat position-package/README.txt.part-* > docs/position_hold/README.txt
          python -m py_compile tools/run_position_trial.py

      - name: Commit final organized branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf position-package
          rm -f .github/workflows/assemble-position-package.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Finalize organized position hold branch"
            git push origin HEAD:position-hold-bayesian
          fi
