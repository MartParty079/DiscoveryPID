name: Apply encoder settle latch

on:
  push:
    branches:
      - position-hold-bayesian-v1
    paths:
      - .apply-settle-latch-v12

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: position-hold-bayesian-v1
          fetch-depth: 0

      - name: Patch firmware
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/main.cpp")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              '"DiscoveryPID position-hold-v1.1 2026-08-07";',
              '"DiscoveryPID position-hold-v1.2 2026-08-07";'
          )

          replace_once(
              '''constexpr float POSITION_DEADBAND_RPM = 1.20f;\n''',
              '''constexpr float POSITION_DEADBAND_RPM = 1.20f;\n\n// Encoder-resolution-aware settled latch. One output encoder count is about\n// 0.63 degree. After five consecutive 10 ms readings within +/-1 count with\n// no new encoder count, motor drive is forced completely off. It stays off\n// until displacement reaches +/-2 counts.\nconstexpr long POSITION_SETTLE_COUNTS = 1;\nconstexpr long POSITION_WAKE_COUNTS = 2;\nconstexpr uint8_t POSITION_SETTLE_REQUIRED_SAMPLES = 5;\n'''
          )

          replace_once(
              '''bool homed = false;\nbool positionDeadbandActive = false;\n''',
              '''bool homed = false;\nbool positionDeadbandActive = false;\nbool positionSettledLatch = false;\nuint8_t positionSettleSamples = 0;\n'''
          )

          replace_once(
              '''    positionDeadbandActive = false;\n    reversalZeroStartedAt = 0;\n''',
              '''    positionDeadbandActive = false;\n    positionSettledLatch = false;\n    positionSettleSamples = 0;\n    reversalZeroStartedAt = 0;\n'''
          )

          marker = '''void updateCalibration(long currentCount, long deltaCount, uint32_t now)\n{'''
          helper = '''long targetEncoderCount()\n{\n    const float countOffset =\n        targetPositionDeg /\n        (DEGREES_PER_OUTPUT_COUNT * ENCODER_DIRECTION_SIGN);\n\n    return homeEncoderCount + lroundf(countOffset);\n}\n\nbool updatePositionSettledLatch(long currentCount, long deltaCount)\n{\n    const bool settlingAllowed =\n        homed &&\n        (mode == Mode::HOLD || mode == Mode::TEST_RETURN);\n\n    if (!settlingAllowed)\n    {\n        positionSettledLatch = false;\n        positionSettleSamples = 0;\n        return false;\n    }\n\n    const long errorCounts =\n        targetEncoderCount() - currentCount;\n\n    if (positionSettledLatch)\n    {\n        if (labs(errorCounts) >= POSITION_WAKE_COUNTS)\n        {\n            positionSettledLatch = false;\n            positionSettleSamples = 0;\n        }\n        else\n        {\n            positionIntegral = 0.0f;\n            speedIntegral = 0.0f;\n            targetOutputRPM = 0.0f;\n            speedErrorRPM = 0.0f;\n            reversalZeroStartedAt = 0;\n            appliedDirection = 0;\n            setMotorRaw(0.0f);\n            return true;\n        }\n    }\n\n    const bool withinEncoderResolution =\n        labs(errorCounts) <= POSITION_SETTLE_COUNTS;\n\n    const bool noNewEncoderCount =\n        deltaCount == 0;\n\n    if (withinEncoderResolution && noNewEncoderCount)\n    {\n        if (positionSettleSamples < POSITION_SETTLE_REQUIRED_SAMPLES)\n        {\n            ++positionSettleSamples;\n        }\n\n        if (positionSettleSamples >= POSITION_SETTLE_REQUIRED_SAMPLES)\n        {\n            positionSettledLatch = true;\n            positionIntegral = 0.0f;\n            speedIntegral = 0.0f;\n            targetOutputRPM = 0.0f;\n            speedErrorRPM = 0.0f;\n            reversalZeroStartedAt = 0;\n            appliedDirection = 0;\n            setMotorRaw(0.0f);\n            return true;\n        }\n    }\n    else\n    {\n        positionSettleSamples = 0;\n    }\n\n    return false;\n}\n\nvoid updateCalibration(long currentCount, long deltaCount, uint32_t now)\n{'''
          replace_once(marker, helper)

          replace_once(
              '''    Serial.print(" Homed=");\n    Serial.print(homed ? 1 : 0);\n\n    Serial.print(" KP=");''',
              '''    Serial.print(" Homed=");\n    Serial.print(homed ? 1 : 0);\n\n    Serial.print(" Settled=");\n    Serial.print(positionSettledLatch ? 1 : 0);\n\n    Serial.print(" KP=");'''
          )

          old_controller = '''        else\n        {\n            const bool useSetupController =\n                mode == Mode::TEST_OUT ||\n                mode == Mode::TEST_DWELL;\n\n            const float positionVelocityDegPerSec =\n                measuredOutputRPM * 6.0f;\n\n            targetOutputRPM =\n                calculatePositionSpeedTarget(\n                    positionErrorDeg,\n                    positionVelocityDegPerSec,\n                    dt,\n                    useSetupController\n                );\n\n            float desiredPWM =\n                calculateSpeedPWM(targetOutputRPM, dt);\n\n            desiredPWM =\n                applyReversalInterlock(desiredPWM, now);\n\n            setMotorRaw(desiredPWM);\n\n            // Stall protection only when the controller is asking for motion\n            // because a static holding torque is valid near home.\n            const bool stallProtectionEnabled =\n                mode == Mode::TEST_OUT ||\n                mode == Mode::TEST_RETURN;\n\n            const bool possibleStall =\n                stallProtectionEnabled &&\n                fabsf(positionErrorDeg) >= STALL_ERROR_THRESHOLD_DEG &&\n                fabsf(appliedMotorCommand) >= STALL_PWM_THRESHOLD &&\n                deltaCount == 0;\n\n            if (possibleStall)\n            {\n                if (stallStartedAt == 0)\n                {\n                    stallStartedAt = now;\n                }\n\n                if (now - stallStartedAt >= STALL_TIMEOUT_MS)\n                {\n                    enterFault("STALL");\n                }\n            }\n            else\n            {\n                stallStartedAt = 0;\n            }\n        }'''

          new_controller = '''        else\n        {\n            const bool settledAndMotorOff =\n                updatePositionSettledLatch(currentCount, deltaCount);\n\n            if (settledAndMotorOff)\n            {\n                stallStartedAt = 0;\n            }\n            else\n            {\n                const bool useSetupController =\n                    mode == Mode::TEST_OUT ||\n                    mode == Mode::TEST_DWELL;\n\n                const float positionVelocityDegPerSec =\n                    measuredOutputRPM * 6.0f;\n\n                targetOutputRPM =\n                    calculatePositionSpeedTarget(\n                        positionErrorDeg,\n                        positionVelocityDegPerSec,\n                        dt,\n                        useSetupController\n                    );\n\n                float desiredPWM =\n                    calculateSpeedPWM(targetOutputRPM, dt);\n\n                desiredPWM =\n                    applyReversalInterlock(desiredPWM, now);\n\n                setMotorRaw(desiredPWM);\n\n                // Stall protection only during automatic JMP test motion.\n                const bool stallProtectionEnabled =\n                    mode == Mode::TEST_OUT ||\n                    mode == Mode::TEST_RETURN;\n\n                const bool possibleStall =\n                    stallProtectionEnabled &&\n                    fabsf(positionErrorDeg) >= STALL_ERROR_THRESHOLD_DEG &&\n                    fabsf(appliedMotorCommand) >= STALL_PWM_THRESHOLD &&\n                    deltaCount == 0;\n\n                if (possibleStall)\n                {\n                    if (stallStartedAt == 0)\n                    {\n                        stallStartedAt = now;\n                    }\n\n                    if (now - stallStartedAt >= STALL_TIMEOUT_MS)\n                    {\n                        enterFault("STALL");\n                    }\n                }\n                else\n                {\n                    stallStartedAt = 0;\n                }\n            }\n        }'''
          replace_once(old_controller, new_controller)

          replace_once(
              '''        const bool worthShowing =\n            fabsf(positionErrorDeg) >= 0.9f ||\n            fabsf(measuredOutputRPM) >= 1.0f ||\n            fabsf(appliedMotorCommand) >= 1.0f;''',
              '''        const bool worthShowing =\n            !positionSettledLatch &&\n            (\n                fabsf(positionErrorDeg) >= 0.9f ||\n                fabsf(measuredOutputRPM) >= 1.0f ||\n                fabsf(appliedMotorCommand) >= 1.0f\n            );'''
          )

          path.write_text(text, encoding="utf-8")

      - name: Commit patch and remove temporary updater
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .apply-settle-latch-v12 .github/workflows/apply-settle-latch.yml
          git add -A
          git commit -m "Add encoder-resolution settled latch"
          git push origin HEAD:position-hold-bayesian-v1
